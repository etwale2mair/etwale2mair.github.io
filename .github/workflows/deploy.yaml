name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Build Quartz into /writeups
        run: npx quartz build -o public/writeups
      - name: Generate writeups index
        run: node scripts/gen-writeups-index.mjs public/writeups landing/writeups.json
      - name: Assemble landing page at root
        run: |
          cp landing/index.html landing/style.css landing/app.js landing/writeups.json landing/cv.pdf public/
          mkdir -p public/data
          cp landing/data/profile.json public/data/profile.json
          if [ -d landing/sealed ]; then mkdir -p public/sealed && cp landing/sealed/*.md public/sealed/ 2>/dev/null || true; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
